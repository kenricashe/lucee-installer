<IfDefine LUCEE_UPGRADE_IN_PROGRESS>
	# Load IP bypass configuration
	<IfModule mod_include.c>
		Include /opt/lucee/sys/upgrade-in-progress/ip-allow.conf
	</IfModule>
	
	# For bypass IPs: normal functionality (no rewrite)
	# For all other IPs: show upgrade page
	<IfModule mod_rewrite.c>
		RewriteEngine On
		# Skip rewrite if environment variable is set (allowed IPs)
		RewriteCond %{ENV:LUCEE_UPGRADE_BYPASS} !=1
		RewriteRule ^.*\.(cfm|cfml|cfs|cfc)(/.*)?$ /upgrade-in-progress.html [L]
	</IfModule>
	
	<IfModule headers_module>
		Header set Cache-Control "no-store, no-cache, must-revalidate"
		# Status page detects upgrade mode via HEAD request
		Header set X-Lucee-Upgrade "1"
	</IfModule>
	
	# Friendly url routing e.g. /login => /login.cfm
	# is normally handled by 404.cfm, but when
	# Lucee is not running, this is needed:
	ErrorDocument 404 /upgrade-in-progress.html
</IfDefine>
