# Global AJP + mod_cfml configuration for Lucee/Apache
#
# This file is deployed to /opt/lucee/sys/upgrade-in-progress/
# and used by configure-apache.sh to generate the active global
# Apache config (conf-available on Debian; conf.d on RHEL/cPanel).
#
# The configure-apache.sh script will replace the REDACTED values
# using Tomcat's server.xml (defaults to /opt/lucee/tomcat/conf/server.xml).
# You can override the detection by exporting TOMCAT_SERVER_XML.

<IfModule mod_proxy.c>
	ProxyPreserveHost On
	# AJP proxy for Lucee CFML handlers (update port/secret via script)
	ProxyPassMatch ^/(.+\.cf[msc])(/.*)?$ ajp://127.0.0.1:8009/$1$2 flushpackets=on secret=REDACTED
	ProxyPassMatch ^/(.+\.cfml)(/.*)?$ ajp://127.0.0.1:8009/$1$2 flushpackets=on secret=REDACTED
	ProxyPassReverse / ajp://127.0.0.1:8009/ secret=REDACTED
	LoadModule modcfml_module modules/mod_cfml.so
</IfModule>

<IfModule mod_cfml.c>
	CFMLHandlers ".cfm .cfs .cfc .cfml"
	ModCFML_SharedKey "REDACTED"
	LogHeaders false
	LogHandlers false
	LogAliases false
	VDirHeader false
</IfModule>
