<!DOCTYPE html>
<html>
<head>
	<title>Server/Software Upgrade In Progress</title>
	<meta name="robots" content="noindex, nofollow">
<script>
window.addEventListener('DOMContentLoaded', function() {
	const numInterval = 60000;
	function checkUpgradeStatus() {
		fetch(window.location.href, {
			method: 'GET',
			cache: 'no-cache'
		})
		.then(response => response.text())
		.then(html => {
			if (!html.includes('Upgrade In Progress')) window.location.reload();
		})
		.catch(error => {
			console.log('Error checking upgrade status:', error);
		});
	}
	checkUpgradeStatus();
	setInterval(checkUpgradeStatus, numInterval);
});
</script>
</head>
<body>
<h1>Server/Software Upgrade In Progress</h1>
<p>Barring any unforeseen complications, it should take up to about 15 minutes.</p>
<p>If you're standing by, this page will automatically refresh when the upgrade is complete!</p>
</body>
</html>
