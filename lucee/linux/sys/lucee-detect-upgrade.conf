<IfDefine LUCEE_UPGRADE_IN_PROGRESS>
	<IfModule mod_rewrite.c>
		RewriteEngine On
		# RewriteRule ^.*\.(cfm|cfml|cfs|cfc)(/.*)?$ /upgrade-in-progress.html [L]
		# Turns out no need to rewrite the Lucee file extensions when AJP proxy is disabled.
		# Apparently (?) Apache treats unknown extensions as non-existent files
		# when evaluating RewriteCond %{REQUEST_FILENAME} !-f
		RewriteCond %{REQUEST_FILENAME} !-f
		RewriteCond %{REQUEST_FILENAME} !-d
		RewriteRule .* /upgrade-in-progress.html [L]
		# Those rewrite conditions also change 404 Not Found to 200 OK,
		# which is important when 404.cfm is disabled because that results in
		# the friendly url routing e.g. /login => /login.cfm being orphaned
		# (because /login doesn't exist as a physical file).
	</IfModule>
</IfDefine>
